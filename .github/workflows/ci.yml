name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run in a Fedora container rather than directly on the Ubuntu
# runner: C++26 needs GCC 14+, and cmake/toolchain-mingw64.cmake hardcodes
# Fedora's mingw sysroot layout. Fedora 44 matches the development machines.
#
# git is installed before actions/checkout on purpose: without git in the
# container the action falls back to a tarball download, which has no
# submodules and no history for the version hash.

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ cmake make git
          glfw-devel libglvnd-devel gtk3-devel alsa-lib-devel

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel "$(nproc)"

      - name: Test
        run: ctest --preset default

  windows:
    name: Windows cross-build, tests under Wine, installer
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      # Wine's DirectSound backs onto ALSA; a null PCM lets the audio tests
      # run without sound hardware
      ALSA_CONFIG_PATH: /tmp/asound.conf
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          mingw64-gcc-c++ cmake make git
          wine-core wine-alsa
          mingw32-nsis pandoc

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows --parallel "$(nproc)"

      - name: Prepare Wine
        run: |
          printf 'pcm.!default {\n\ttype null\n}\n' > "$ALSA_CONFIG_PATH"
          wineboot --init
          wineserver --wait

      - name: Test
        run: ctest --preset windows

      # built on every run so a broken installer script is caught early, but
      # only kept for tagged versions (v0.1.3, v0.2.0-rc.1, ...)
      - name: Build installer
        run: ./build-windows.sh --installer

      - name: Upload installer for tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: rumpu-${{ github.ref_name }}-win64-installer
          path: build-windows/Rumpu-*-win64.exe
          if-no-files-found: error
